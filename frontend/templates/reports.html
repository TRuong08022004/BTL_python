{% extends 'base.html' %}
{% block content %}
<div class="card content-card mb-4"><div class="card-header"><h3 class="card-title">Chi tiết theo kỳ</h3></div><div class="card-body table-responsive p-0">
  <table class="table mb-0"><thead><tr><th>Kỳ</th><th>Tổng hóa đơn</th><th>Số hóa đơn</th><th>Đã thanh toán</th></tr></thead><tbody>
    {% for row in monthly %}
    <tr><td>{{ row.label }}</td><td>{{ row.total|money }}</td><td>{{ row.invoice_count }}</td><td>{{ row.paid_count }}</td></tr>
    {% endfor %}
  </tbody></table>
</div></div>
{% endblock %}
